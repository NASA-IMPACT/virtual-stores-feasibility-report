version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # version comment together. The cooldown skips releases younger than a
  # week, so a compromised release has time to be caught and pulled first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
