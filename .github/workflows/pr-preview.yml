# Render every PR so broken builds show up as a failing check, but only
# deploy previews for branches in this repository. PRs from forks get a
# read-only token, and we do not publish content from outside the repo
# to the Pages site.
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions: {}

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: write # push the preview to gh-pages
      pull-requests: write # sticky comment with the preview link
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Render site
        run: quarto render

      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Note skipped preview for forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Site rendered successfully. Previews are not deployed for pull requests from forks."

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write # remove the preview from gh-pages
      pull-requests: write # update the sticky comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
